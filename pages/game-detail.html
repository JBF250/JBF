</head>
<body>
    <nav id="navbar" class="navbar">
        <div class="navbar-container">
            <ul class="navbar-links">
                <li><a href="../index.html#hero" class="nav-link" data-i18n="nav.welcome">欢迎</a></li>
                <li><a href="../index.html#about" class="nav-link" data-i18n="nav.about">关于</a></li>
                <li><a href="../index.html#games" class="nav-link active" data-i18n="nav.games">游戏开发</a></li>
                <li><a href="../index.html#software" class="nav-link" data-i18n="nav.software">软件开发</a></li>
                <li><a href="../index.html#contact" class="nav-link" data-i18n="nav.contact">联系</a></li>
                <li><a href="blog-login.html" class="nav-link" data-i18n="nav.blog">博客</a></li>
            </ul>
            <div class="navbar-actions">
                <button id="language-switcher" class="btn btn-ghost btn-sm">EN</button>
                <button id="theme-switcher" class="theme-switcher" title="切换主题">
                    <div class="theme-dark"></div>
                    <div class="theme-light"></div>
                </button>
            </div>
            <button class="navbar-toggle" id="navbar-toggle">
                <span class="toggle-bar"></span>
                <span class="toggle-bar"></span>
                <span class="toggle-bar"></span>
            </button>
        </div>
    </nav>

    <section class="hero-section detail-hero-section">
        <div class="stars-container">
            <div class="star" style="top: 10%; left: 20%;"></div>
            <div class="star" style="top: 20%; left: 80%;"></div>
            <div class="star" style="top: 30%; left: 40%;"></div>
            <div class="star" style="top: 50%; left: 60%;"></div>
            <div class="star" style="top: 70%; left: 30%;"></div>
            <div class="star" style="top: 80%; left: 70%;"></div>
        </div>

        <div class="planet-container">
            <div class="orbit orbit-1">
                <div class="planet planet-1">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                    </svg>
                </div>
            </div>
            <div class="orbit orbit-2">
                <div class="planet planet-2">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2z"/>
                        <path d="M12 2v10"/>
                    </svg>
                </div>
            </div>
            <div class="orbit orbit-3">
                <div class="planet planet-3">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2z"/>
                        <path d="M12 2v10M12 12h10"/>
                    </svg>
                </div>
            </div>
        </div>

        <div class="hero-bg-image detail-hero-bg"></div>

        <div class="hero-content">
            <span class="section-badge fade-in" data-i18n="nav.games">游戏开发</span>
            <h1 class="hero-title fade-in" id="game-title">游戏名称</h1>
            <p class="hero-subtitle fade-in" id="game-description">游戏描述...</p>
            <div class="hero-tags fade-in" id="game-tech">
            </div>
            <div class="scroll-indicator fade-in">
                <span class="scroll-text" data-i18n="detail.scroll_down">向下滚动查看详情</span>
                <div class="scroll-arrow"></div>
            </div>
        </div>
    </section>

    <section class="section detail-preview-section">
        <div class="container">
            <div class="detail-preview-wrapper fade-in">
                <div class="detail-preview-frame">
                    <div class="detail-preview">
                        <img id="game-preview" src="" alt="游戏预览">
                    </div>
                    <div class="preview-glow"></div>
                </div>
            </div>
        </div>
    </section>

    <section class="section detail-about-section">
        <div class="container">
            <div class="detail-about fade-in">
                <div class="section-header">
                    <span class="section-badge" data-i18n="detail.overview">项目概述</span>
                    <h2 class="section-title" data-i18n="detail.about_game">关于这款游戏</h2>
                </div>
                <div class="detail-desc-wrapper">
                    <p class="detail-desc" id="game-full-description"></p>
                </div>
                <div class="detail-actions">
                    <a href="../index.html" class="btn btn-primary btn-lg">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px;">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                        <span data-i18n="detail.back_to_home">回到首页</span>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">
                    <img src="../pictures/JBF250.png" alt="JBF250 Logo" class="footer-logo-image">
                    <span class="footer-text" data-i18n="footer.slogan">用代码创造价值</span>
                </div>
                <div class="footer-links">
                    <a href="../index.html#hero" data-i18n="nav.welcome">欢迎</a>
                    <a href="../index.html#about" data-i18n="nav.about">关于</a>
                    <a href="../index.html#games" data-i18n="nav.games">游戏</a>
                    <a href="../index.html#software" data-i18n="nav.software">软件</a>
                    <a href="../index.html#contact" data-i18n="nav.contact">联系</a>
                    <a href="blog-login.html" data-i18n="nav.blog">博客</a>
                </div>

            <div class="footer-copyright">
                <span class="mono" data-i18n="footer.copyright">© 2026 JBF250. All rights reserved.</span>
            </div>
        </div>

    <script src="../js/i18n.js"></script>

    <script src="../js/scroll-animation.js"></script>
